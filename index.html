<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OnCourt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Agenda OnCourt</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supa-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: identidade OnCourt, versão enxuta. Menu lateral (fixo no computador, deslizante no celular) com Dashboard, Calendário, Arquivos e Métricas. Tela de PIN antes de abrir. */
:root{
  --paper:#FFF8F3; --surface:#FFFDFB; --sunken:#F4E6DA; --ink:#211E1C; --muted:#6F625A; --line:#E3D3C5;
  --accent:#B45F43; --on-accent:#FFF8F3; --marker:#E9A487; --marker-ink:#2B1A12; --hl:#F8DDD0;
  --ev:#264653; --task:#B45F43; --note:#5E6D56; --danger:#A3312A; --ok:#5E6D56; --arc:#B45F43;
  --c1:#B45F43; --c2:#264653; --c3:#5E6D56; --c4:#D98A66; --c5:#8A6A4F; --c6:#7A5C7E;
  --shadow:0 1px 2px rgba(33,30,28,.06),0 10px 28px rgba(80,45,30,.10);
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161413; --surface:#211E1C; --sunken:#2B2623; --ink:#FFF8F3; --muted:#B9A99C; --line:#3A322D;
  --accent:#E9A487; --on-accent:#211E1C; --marker:#B45F43; --marker-ink:#FFF8F3; --hl:#553226;
  --ev:#8DB4BE; --task:#E9A487; --note:#A9B998; --danger:#F08A78; --ok:#A9B998; --arc:#6E3A2A;
  --c1:#E9A487; --c2:#8DB4BE; --c3:#A9B998; --c4:#F2BE8F; --c5:#C9AB8E; --c6:#C4A3C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
  :root:not([data-theme="light"]) .logo-c{display:none} :root:not([data-theme="light"]) .logo-l{display:block}}
:root[data-theme="dark"]{
  --paper:#161413; --surface:#211E1C; --sunken:#2B2623; --ink:#FFF8F3; --muted:#B9A99C; --line:#3A322D;
  --accent:#E9A487; --on-accent:#211E1C; --marker:#B45F43; --marker-ink:#FFF8F3; --hl:#553226;
  --ev:#8DB4BE; --task:#E9A487; --note:#A9B998; --danger:#F08A78; --ok:#A9B998; --arc:#6E3A2A;
  --c1:#E9A487; --c2:#8DB4BE; --c3:#A9B998; --c4:#F2BE8F; --c5:#C9AB8E; --c6:#C4A3C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme="dark"] .logo-c{display:none} :root[data-theme="dark"] .logo-l{display:block}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.logo-l{display:none}
.arc{position:fixed;pointer-events:none;z-index:-1;border-radius:50%;border-style:solid;border-color:var(--arc);width:520px;height:520px;border-width:56px;top:-400px;right:-310px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:6px}

/* Tela de PIN */
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lock-card{position:relative;z-index:1;width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.lock-brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lock-brand .lgA{width:84px;height:84px;margin-bottom:4px}
.lock form{display:flex;flex-direction:column;gap:12px}
.lock h2{margin:0;font-family:var(--f-display);font-size:22px;text-align:center}
.lock p{margin:0;text-align:center}
.pin-in{font-family:var(--f-mono);font-size:24px;letter-spacing:.35em;text-align:center;padding:12px!important}
.btn.big{padding:12px;font-size:15px}
.lock .err{text-align:center}

/* Estrutura */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;align-content:start}
.sidenav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 18px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding-inline:8px}
.lgA{color:var(--ev);flex:none;display:block}
.brand .lgA{width:46px;height:46px}
.wm{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.06em;color:var(--accent);line-height:1}
.slogan{font-size:10.5px;font-weight:600;letter-spacing:.38em;color:var(--ev);margin-top:3px}
.navs{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:10px 11px;font-weight:500;color:var(--ink);text-align:left;width:100%;font-size:14px}
.nv svg{flex:none;color:var(--muted)}
.nv:hover{background:var(--sunken)}
.nv[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nv[aria-current="page"] svg,.nv[aria-current="page"] .c{color:var(--on-accent)}
.nv .c{margin-left:auto;font:500 11.5px/1.6 var(--f-mono);color:var(--muted)}
.nv .c.late{background:var(--danger);color:var(--surface);border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 6px 0;border-top:1px solid var(--line)}
.side-foot .btn{text-align:left}
.status{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding-inline:4px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.on i{background:var(--ok)}
.scrim{display:none}
.content{min-width:0;padding-inline:40px;padding-block:28px 120px;max-width:1240px;width:100%}
.menu-btn{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);place-items:center;padding:0;flex:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidenav{position:fixed;top:0;left:0;bottom:0;height:100%;width:min(300px,86vw);z-index:60;transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .sidenav.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(22,20,19,.45);z-index:55}
  .menu-btn{display:grid}
  .content{padding-inline:16px;padding-block:16px 110px}
  .arc{display:none}
}
@media (prefers-reduced-motion:reduce){.sidenav{transition:none}}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.title-row{display:flex;gap:12px;align-items:center;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.6vw,32px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.mark{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%);padding-inline:.06em}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:6px;align-items:center}
.search{position:relative}
.search input{width:240px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px 0 36px}
.search>svg{position:absolute;left:12px;top:13px;color:var(--muted);pointer-events:none}
.sres{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(440px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sr-it{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.sr-it:first-child{border-top:0}
.sr-it:hover,.sr-it.on{background:var(--sunken)}
.sr-k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:2px}
.sr-it b{font-weight:600;display:block;overflow-wrap:anywhere}
.sr-it span.s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--marker);color:var(--marker-ink);border-radius:2px;padding:0 1px}
.bellwrap{position:relative}
.bell-btn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:0;display:grid;place-items:center;padding:0}
.bell-btn:hover{border-color:var(--muted)}
.bell-btn[aria-expanded="true"]{background:var(--sunken)}
.bell-emoji{display:inline-grid;transform-origin:50% 8%}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--surface);font:700 11px/20px var(--f-mono);text-align:center;border:2px solid var(--paper)}
@media (prefers-reduced-motion:no-preference){.bell-btn.ring .bell-emoji{animation:ring 1s ease-in-out 2}
  @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}}
.bellpop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(360px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.bp-h strong{font-family:var(--f-display);font-size:16px}
.bp-h button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.bp-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px 4px}
.bp-it{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 14px;align-items:start}
.bp-it:hover{background:var(--sunken)}
.bp-it i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.bp-it.unread i{background:var(--danger)}
.bp-it b{font-weight:600;display:block;overflow-wrap:anywhere}
.bp-it.read b{font-weight:500;color:var(--muted)}
.bp-it span{font-size:12.5px;color:var(--muted)}
.bp-empty{padding:14px;color:var(--muted);font-size:13px}
@media (max-width:900px){
  .top{flex-direction:column;align-items:stretch;gap:12px}
  .top-r{width:100%}
  .search{flex:1 1 0;min-width:0;order:-2}.search input{width:100%}.sres{left:0;right:auto}
  .bellwrap{order:-1}
  .nav{order:1;width:100%}
}

/* Barra rápida */
.quick{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:16px}
.quick input[type="text"],.quick textarea{flex:1 1 220px;min-width:0;border:0;background:transparent;padding:8px 6px;font-size:15px}
.quick textarea{resize:vertical;min-height:72px;flex-basis:100%}
.qhint{margin-right:auto;font-size:12px}
@media (max-width:640px){.qhint{flex:1 1 100%}}
.qtask{flex-direction:column;align-items:stretch;gap:6px}
.qtask #qt{flex:none;font-weight:600;font-size:14.5px;border:0;background:transparent;padding:8px 6px}
.qtask .qcl textarea{flex:none}
.qtask #qtDesc{flex:none;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 6px 4px;resize:none;overflow:hidden;min-height:0;font-size:14px;border-radius:0}
.qtask .qhint{text-align:left;padding-left:6px}
.qcl{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.qcl textarea{border:1px dashed var(--line)!important;background:var(--paper)!important;border-radius:9px;padding:8px 10px!important;min-height:0!important;resize:none;overflow:hidden;font-size:14px;line-height:1.5}
.qtask .r{width:100%}
.quick select#qtTime{max-width:none}
.quick input[type="date"]{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 8px;min-width:0}
.quick .r{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.quick .r{width:100%}.quick .r select,.quick .r input[type="date"]{flex:1 1 120px;max-width:none}}
.quick:focus-within{border-color:var(--accent)}

/* Painéis */
.stack{display:flex;flex-direction:column;gap:24px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--f-display);font-size:16.5px;font-weight:700;margin:0}
.panel-h .sub{color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 16px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:0}
.strip b{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.strip span{font-size:12.5px;color:var(--muted)}
.strip div:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.strip div:first-child span{color:var(--on-accent);opacity:.85}
.tiles{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{margin-bottom:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:29px;line-height:1.15;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.tile b small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .s{font-size:13px;color:var(--muted);margin-top:4px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:16px}.tile b{font-size:24px}.dashwrap,.dash{gap:22px}.it{padding:13px 16px}.panel-h{padding:16px}.group-label{padding:16px 16px 6px}.nd,.wn{padding-inline:16px}.strip b{font-size:24px}.strip div{padding:10px 11px}}

/* Itens */
.group-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:18px 20px 8px;display:flex;gap:8px;align-items:center}
.group-label .n{font-family:var(--f-mono);font-weight:500}
.group-label.late{color:var(--danger)}
.it{display:grid;grid-template-columns:60px 22px minmax(0,1fr);gap:12px;align-items:start;padding:14px 20px;border-top:1px solid var(--line)}
.group-label + .it{border-top:0}
.it-time{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px;display:flex;flex-direction:column;line-height:1.3}
.it-time small{color:var(--muted);font-size:11.5px}
.it-mark{display:grid;place-items:center;height:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ev)}
.sq{width:10px;height:10px;border-radius:2px;background:var(--note);transform:rotate(45deg)}
.chk{width:21px;height:21px;border-radius:6px;border:2px solid var(--task);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{opacity:0}
.chk[aria-pressed="true"]{background:var(--task)}
.chk[aria-pressed="true"] svg{opacity:1}
.it-main{border:0;background:transparent;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column;gap:3px}
.it-title{font-weight:600;overflow-wrap:anywhere}
.it.is-done .it-title{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12.5px;align-items:center}
.meta>span{display:inline-flex;align-items:center;gap:4px}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid currentColor;color:var(--danger)}
.ex{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--sunken);color:var(--muted);padding:2px 6px;border-radius:5px}
.late-txt{color:var(--danger);font-weight:600}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px}
.prog .bar{width:46px;height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;display:block}
.prog .bar i{display:block;height:100%;background:var(--task)}
.empty{padding:26px 20px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}
.more{padding:10px 16px 14px}

/* Calendário */
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.scroll{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px}
.wk-col{border-left:1px solid var(--line);min-height:320px;display:flex;flex-direction:column}
.wk-col:first-child{border-left:0}
.wk-head{border:0;background:transparent;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:6px}
.wk-head .dn{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.wk-head .dd{font-family:var(--f-display);font-weight:700;font-size:20px}
.wk-col.today .dd{background:var(--marker);color:var(--marker-ink);padding:0 5px;border-radius:4px}
.wk-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.chip{border:0;text-align:left;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.3;background:var(--sunken);border-left:3px solid var(--ev);min-width:0}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11px;display:block;color:var(--muted)}
.chip span{overflow-wrap:anywhere}

async function hashPin(pin,salt){
  try{if(window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }}catch(e){}
  let h=2166136261;for(const c of salt+'|'+pin){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'x'+(h>>>0).toString(16);
}
const newSalt=()=>{try{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)+Date.now()}};
function sessionOk(){try{return lockRec&&sessionStorage.getItem('oncourt.unlock')===lockRec.hash}catch(e){return false}}
function lockReady(){

}
function showLock(mode){

  ['#lk-cur','#lk-pin','#lk-conf'].forEach(s=>$(s).value='');$('#lk-err').textContent='';
  $('#lk-btn').hidden=false;$('#lk-alt').hidden=false;
  if(mode==='setup'){$('#lk-title').textContent='Crie seu PIN';$('#lk-text').textContent='Ele será pedido sempre que a agenda for aberta, no computador ou no celular. Use de 4 a 8 números.';
    set(0,1,1);$('#lk-pin-l').textContent='Novo PIN';$('#lk-btn').textContent='Criar PIN e entrar';$('#lk-alt').hidden=true}
  else if(mode==='enter'){$('#lk-title').textContent='Digite seu PIN';$('#lk-text').textContent='';set(0,1,0);$('#lk-pin-l').textContent='PIN';$('#lk-btn').textContent='Entrar';$('#lk-alt').textContent='Esqueci meu PIN'}
  else if(mode==='change'){$('#lk-title').textContent='Trocar PIN';$('#lk-text').textContent='';set(1,1,1);$('#lk-pin-l').textContent='Novo PIN';$('#lk-btn').textContent='Salvar novo PIN';$('#lk-alt').textContent='Cancelar'}
  setTimeout(()=>{const f=mode==='change'?$('#lk-cur'):$('#lk-pin');f&&f.focus()},50);
}
function openApp(){
  unlocked=true;lockMode='open';$('#lock').hidden=true;$('#app').hidden=false;
  try{sessionStorage.setItem('oncourt.unlock',lockRec.hash)}catch(e){}

}
function lockNow(){try{sessionStorage.removeItem('oncourt.unlock')}catch(e){}closeDrawer();if(dlg.open)dlg.close();if($('#fidlg').open)$('#fidlg').close();if($('#fdlg').open)$('#fdlg').close();$('#sres').hidden=true;$('#q').value='';$('#toasts').innerHTML='';showLock(lockRec?'enter':'setup')}
$('#lockForm').addEventListener('submit',async e=>{
  e.preventDefault();const err=m=>{$('#lk-err').textContent=m};

const all=()=>[...items.values()].filter(i=>i.kind==='task'||i.kind==='event');
const cmpTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||String(a.title).localeCompare(String(b.title));
function occursOn(i,s){
  if(!i.date)return false;
  if(!i.repeat||i.kind!=='event')return i.date===s;
  if(s<i.date||(i.until&&s>i.until))return false;
  const a=parse(i.date),b=parse(s);
  if(i.repeat==='daily')return true;
  if(i.repeat==='weekdays'){const w=b.getDay();return w>0&&w<6}
  if(i.repeat==='weekly')return a.getDay()===b.getDay();
  if(i.repeat==='monthly')return a.getDate()===b.getDate();
  return false;
}
const onDate=s=>all().filter(i=>occursOn(i,s)).sort(cmpTime);
const msAt=(s,t)=>{const d=parse(s);const[h,m]=(t||'09:00').split(':').map(Number);d.setHours(h,m,0,0);return d.getTime()};
function occurrences(fromStr,days,filter){
  const out=[];const list=all().filter(filter||(()=>true));let d=parse(fromStr);
  for(let k=0;k<days;k++){const s=ymd(d);for(const i of list)if(occursOn(i,s))out.push({i,date:s,start:msAt(s,i.time)});d=addDays(d,1)}
  return out;
}

const fname=i=>{const f=folders.get(folderOf(i));return f?f.name:'Sem pasta'};
function weekReport(ws){
  const a=parse(ws),aMs=a.getTime(),bMs=addDays(a,7).getTime(),end=ymd(addDays(a,6)),nEnd=ymd(addDays(a,13)),t=todayStr();
  const done=tasks().filter(i=>i.done&&doneAt(i)>=aMs&&doneAt(i)<bMs).sort((x,y)=>doneAt(x)-doneAt(y));
  const occ=occurrences(ws,7,i=>i.kind==='event');
  const hours=occ.reduce((s,o)=>{const i=o.i;if(!i.time)return s;const st=toMin(i.time),e=i.endTime&&i.endTime>i.time?toMin(i.endTime):st+60;return s+(e-st)/60},0);
  const open=openTasks().filter(i=>i.date&&i.date<=end).sort((x,y)=>x.date.localeCompare(y.date));
  const next=openTasks().filter(i=>i.date&&i.date>end&&i.date<=nEnd).sort((x,y)=>x.date.localeCompare(y.date));
  const late=open.filter(i=>i.date<t);
  const fl=[...files.values()].filter(f=>(f.createdAt||0)>=aMs&&(f.createdAt||0)<bMs).sort((x,y)=>x.createdAt-y.createdAt);
  return {ws,end,done,occ,hours,open,next,late,fl,note:(weekNotes.get(ws)||{}).text||''};
}

const fileToB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('Não foi possível ler o arquivo.'));r.readAsDataURL(f)});
function b64ToBlob(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u])}

async function uploadFiles(list,folder,taskId){

    try{

      if(f.size>LIM[spec[1]])throw new Error(`Arquivo de ${fmtSize(f.size)}. O limite para ${spec[0]} é ${fmtSize(LIM[spec[1]])}.`);
      ref=store.ficol.doc();const meta={name:f.name,ext,size:f.size,folder:folder||'',taskId:taskId||'',desc:'',storage:spec[1],createdAt:Date.now(),updatedAt:Date.now()};

async function downloadFile(f){
  if(!f)return;
  if(!dlNs){toast('Download indisponível','Esta visualização não permite baixar arquivos.');return}
  try{
    let blob;
    if(f.storage==='asset'){const r=await fetch('/_blob/'+f.assetId);if(!r.ok)throw {code:'missing'};blob=await r.blob()}
    else{const parts=[];for(let k=0;k<(f.chunks||0);k++){const sn=await store.db.doc(`filechunks/${f.id}_${k}`).get();if(!sn.exists)throw {code:'missing'};parts.push(sn.data().d)}blob=b64ToBlob(parts.join(''))}
    let name=f.name;if(extOf(name)!==f.ext)name+='.'+f.ext;
    await dlNs.save({filename:name,data:blob});
  }catch(e){if(e&&e.code==='declined')return;toast('Não foi possível baixar',e&&e.code==='missing'?'O arquivo não foi encontrado.':e&&e.code==='rejected_extension'?'Este formato não pode ser baixado por aqui.':'Tente de novo.')}
}

/* Calendário */
function viewCal(){
  const seg=`<div class="seg" role="group" aria-label="Visualização">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([k,l])=>`<button data-act="calmode" data-m="${k}" aria-pressed="${calMode===k}">${l}</button>`).join('')}</div>`;
  if(calMode==='day'){
    const list=onDate(cursor);
    return `<section class="panel"><div class="panel-h">${seg}<span class="sub">${list.length} ${ss(list.length,'item','itens')}</span></div>
      ${list.length?list.map(i=>row(i)).join(''):'<div class="empty"><strong>Dia livre.</strong><span>Toque em Novo para marcar um compromisso.</span></div>'}</section>`;
  }
  if(calMode==='week'){
    const a=weekStart(parse(cursor)),t=todayStr();let cols='';
    for(let k=0;k<7;k++){const d=addDays(a,k),s=ymd(d);
      cols+=`<div class="wk-col${s===t?' today':''}"><button class="wk-head" data-act="goday" data-date="${s}"><span class="dn">${DIAS3[d.getDay()]}</span><span class="dd">${d.getDate()}</span></button><div class="wk-body">${onDate(s).map(i=>`<button class="chip k-${i.kind}${i.done?' done':''}" data-act="edit" data-id="${i.id}">${i.time?`<b>${i.time}</b>`:''}<span>${esc(i.title)}</span></button>`).join('')}</div></div>`}
    const wk=ymd(a),wn=all().filter(i=>i.kind==='note'&&i.week===wk).sort(noteSort);
    return `<section class="panel"><div class="panel-h">${seg}</div>${wn.length?`<div class="wstrip"><span class="lbl">Anotações da semana</span>${wn.map(n=>`<button class="adchip" data-act="edit" data-id="${n.id}">${esc(n.title)}</button>`).join('')}</div>`:''}<div class="scroll"><div class="week">${cols}</div></div></section>`;
  }
  const d=parse(cursor),first=new Date(d.getFullYear(),d.getMonth(),1),start=weekStart(first),t=todayStr();let cells='';
  for(let k=0;k<42;k++){const c=addDays(start,k),s=ymd(c);if(k===35&&c.getMonth()!==d.getMonth())break;const list=onDate(s);
    cells+=`<button class="mc${c.getMonth()!==d.getMonth()?' out':''}${s===t?' today':''}${s===cursor?' sel':''}" data-act="goday" data-date="${s}" aria-label="${c.getDate()} de ${MESES[c.getMonth()]}, ${list.length} itens"><span class="num">${c.getDate()}</span>
      ${list.slice(0,3).map(i=>`<span class="ml k-${i.kind}"><i></i>${i.time?`<span class="mono">${i.time}</span> `:''}${esc(i.title)}</span>`).join('')}${list.length>3?`<span class="ml more">+${list.length-3}</span>`:''}<span class="dots">${list.slice(0,5).map(i=>`<i class="k-${i.kind}"></i>`).join('')}</span></button>`}
  return `<section class="panel"><div class="panel-h">${seg}</div><div class="dow">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="month">${cells}</div></section>`;
}

/* Métricas */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(vals,labels,cur){
  const W=vals.length<=8?380:640,H=210,pl=30,pr=8,pt=18,pb=26,max=niceMax(Math.max(...vals,0)),cw=(W-pl-pr)/vals.length,bw=Math.min(30,cw*.6);
  const y=v=>pt+(H-pt-pb)*(1-v/max);let g='';
  ((max/2)%1?[0,max]:[0,max/2,max]).forEach(tk=>{g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(tk)}" y2="${y(tk)}"/><text x="${pl-6}" y="${y(tk)+3}" text-anchor="end">${tk}</text>`});
  vals.forEach((v,k)=>{const x=pl+cw*k+(cw-bw)/2;
    g+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${k===cur?'var(--accent)':'var(--ev)'}"><title>Semana de ${labels[k]}: ${v}</title></rect>`;
    if(v>0)g+=`<text class="val" x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle">${v}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${labels[k]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendências concluídas por semana">${g}</svg>`;
}
function viewMetrics(){
  const N=window.innerWidth<640?8:12,cws=weekStart(new Date()),weeks=[...Array(N)].map((_,k)=>addDays(cws,-7*(N-1-k)));
  const all_=tasks(),done=all_.filter(i=>i.done);
  const perW=weeks.map(w=>{const a=w.getTime(),b=addDays(w,7).getTime();return done.filter(t=>{const x=doneAt(t);return x>=a&&x<b}).length});
  const rate=all_.length?Math.round(done.length/all_.length*100):0;const avg=perW.reduce((a,b)=>a+b,0)/N;
  const best=Math.max(...perW);
  return `<div class="stack"><div class="tiles">
    <div class="tile"><span class="k">Nesta semana</span><b>${perW[N-1]}</b><span class="s">${ss(perW[N-1],'pendência concluída','pendências concluídas')}</span></div>
    <div class="tile"><span class="k">Média semanal</span><b>${String(Math.round(avg*10)/10).replace('.',',')}</b><span class="s">nas últimas ${N} semanas</span></div>
    <div class="tile"><span class="k">Melhor semana</span><b>${best}</b><span class="s">${best?'semana de '+ddmm(weeks[perW.indexOf(best)]):'ainda sem registro'}</span></div>
    <div class="tile"><span class="k">Conclusão</span><b>${rate}<small>%</small></b><span class="s">${done.length} de ${all_.length} pendências</span></div>
  </div>
  <section class="panel"><div class="panel-h"><h2>Pendências concluídas por semana</h2><span class="sub">a barra em destaque é a semana atual</span></div><div class="panel-b">${barChart(perW,weeks.map(ddmm),N-1)}</div></section></div>`;
}

/* adiar */
function snoozeDate(to,cur){const t=new Date();t.setHours(0,0,0,0);
  if(to==='1')return ymd(addDays(t,1));
  if(to==='mon'){const w=t.getDay();return ymd(addDays(t,((8-w)%7)||7))}
  const base=cur&&cur>ymd(t)?parse(cur):t;return ymd(addDays(base,7))}
function snooze(it,to){const d=snoozeDate(to,it.date);store.save({...it,date:d,updatedAt:Date.now()});toast(`Adiada para ${shortDate(d)}`,it.title)}
document.querySelectorAll('#w-snooze [data-snz]').forEach(b=>b.addEventListener('click',()=>{const d=snoozeDate(b.dataset.snz,$('#f-date').value);$('#f-date').value=d;$('#form').requestSubmit();toast(`Adiada para ${shortDate(d)}`,$('#f-title').value)}));
/* repetição */
function nextDate(s,rule,day){const d=parse(s);
  if(rule==='daily')d.setDate(d.getDate()+1);
  else if(rule==='weekdays'){do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6)}
  else if(rule==='weekly')d.setDate(d.getDate()+7);
  else if(rule==='monthly'){const want=day||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(want,last))}
  return ymd(d)}
function spawnNext(it){
  if(!it.repeat||!it.date||it.spawned)return;
  const nd=nextDate(it.date,it.repeat,it.repeatDay);if(it.until&&nd>it.until)return;
  it.spawned=true;
  const n={...it,date:nd,done:false,checklist:(it.checklist||[]).map(c=>({...c,done:false})),createdAt:Date.now(),updatedAt:Date.now()};
  delete n.id;delete n.completedAt;delete n.spawned;delete n.example;
  setTimeout(()=>{store.save(n);toast('Próxima já marcada',`${it.title} · ${shortDate(nd)}`)},50);
}

  const raw=$('#qn').value.trim();if(!raw){$('#qn').focus();return}
  const lines=raw.split('\n');let title=lines[0].trim(),body=lines.slice(1).join('\n').trim();
  if(title.length>90){body=raw;title=title.slice(0,80).replace(/\s+\S*$/,'')+'…'}
  const fo=view==='folder'?curFolder:($('#qnFolder')?$('#qnFolder').value:'');rememberFolder(fo);
  store.save({kind:'note',title,notes:body,pinned:false,date:'',time:'',remind:null,folder:fo,week:$('#qnWeek')?$('#qnWeek').value:'',createdAt:Date.now(),updatedAt:Date.now()});
  $('#qn').value='';$('#qn').focus();
}
document.addEventListener('keydown',e=>{
  if((e.target.id==='qtItems'||e.target.id==='qtDesc')&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#qtForm').requestSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='qtItems'||e.target.id==='qtDesc'){const t=e.target;t.style.height='auto';t.style.height=t.scrollHeight+'px'}});
$('#fab').addEventListener('click',()=>openEditor(null,{kind:view==='cal'?'event':'task'}));

/* ---------- Pastas: criar, editar, excluir ---------- */
const fdlg=$('#fdlg');let fEditing=null,fColor=1;
function renderSwatches(){$('#fd-colors').innerHTML=[1,2,3,4,5,6].map(c=>`<button type="button" data-c="${c}" style="--fc:var(--c${c})" aria-pressed="${fColor===c}" aria-label="Cor ${c}"></button>`).join('')}
function openFolderDlg(f){
  fEditing=f||null;fColor=f?f.color||1:((folders.size%6)+1);
  $('#fd-title').textContent=f?'Editar pasta':'Nova pasta';$('#fd-name').value=f?f.name:'';$('#fd-err').textContent='';
  const del=$('#fd-del');del.hidden=!f;del.classList.remove('armed');del.textContent='Excluir pasta';renderSwatches();
  try{fdlg.showModal()}catch(e){fdlg.setAttribute('open','')}setTimeout(()=>$('#fd-name').focus(),30);
}
$('#fd-colors').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){fColor=+b.dataset.c;renderSwatches()}});
$('#fd-cancel').addEventListener('click',()=>fdlg.close());
$('#fd-del').addEventListener('click',e=>{const b=e.currentTarget;
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar: itens ficam sem pasta';setTimeout(()=>{b.classList.remove('armed');b.textContent='Excluir pasta'},4000);return}
  const id=fEditing.id;fdlg.close();setView('tasks');store.removeFolder(id);toast('Pasta excluída','As pendências e arquivos dela continuam na agenda, sem pasta.')});
$('#fform').addEventListener('submit',async e=>{
  e.preventDefault();const name=$('#fd-name').value.trim();
  if(!name){$('#fd-err').textContent='Dê um nome à pasta.';return}
  if(folderList().some(f=>norm(f.name)===norm(name)&&(!fEditing||f.id!==fEditing.id))){$('#fd-err').textContent='Já existe uma pasta com esse nome.';return}
  fdlg.close();
  if(fEditing){await store.saveFolder({...fEditing,name,color:fColor});renderHeading()}
  else{const id=await store.saveFolder({name,color:fColor,order:Math.max(-1,...folderList().map(f=>f.order??0))+1,createdAt:Date.now()});openFolder(id)}
});
function shift(n){const d=parse(cursor);const mode=view==='dash'?'day':view==='resumo'?'week':calMode;if(mode==='day')d.setDate(d.getDate()+n);else if(mode==='week')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n,1);cursor=ymd(d);render()}
$('#prev').addEventListener('click',()=>shift(-1));$('#next').addEventListener('click',()=>shift(1));
$('#today').addEventListener('click',()=>{cursor=todayStr();render()});
document.addEventListener('keydown',e=>{
  if(!unlocked)return;
  if(e.key==='Escape'){if($('#drawer').classList.contains('open')){closeDrawer();return}if(!$('#bellpop').hidden){setBell(false);return}}
  if(dlg.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  else if(e.key==='n'){e.preventDefault();$('#fab').click()}
  else if(/^[1-5]$/.test(e.key))setView(VIEWS[+e.key-1][0]);
  else if(view==='cal'&&e.key==='ArrowLeft')shift(-1);else if(view==='cal'&&e.key==='ArrowRight')shift(1);
});

/* ---------- Busca ---------- */
const qEl=$('#q');let selIdx=0,sres=[];
function searchItems(q){
  const terms=norm(q).trim().split(/\s+/).filter(Boolean);if(!terms.length)return [];
  return all().map(i=>{const f=folders.get(folderOf(i));const hay=norm([i.title,i.notes,i.place,(i.checklist||[]).map(c=>c.text).join(' '),KINDS[i.kind],f?f.name:'',i.week?weekName(i.week)+' semana '+isoWeek(parse(i.week)):''].join(' '));
    if(!terms.every(x=>hay.includes(x)))return null;const nt=norm(i.title);
    return {i,score:(terms.every(x=>nt.includes(x))?4:0)+(nt.startsWith(terms[0])?2:0)+(i.kind==='task'&&!i.done?1:0)}})
    .filter(Boolean).sort((a,b)=>b.score-a.score||(b.i.updatedAt||0)-(a.i.updatedAt||0)).slice(0,15).map(x=>x.i);
}
function hl(text,terms){
  const s=String(text||'').normalize('NFC'),n=norm(s);if(n.length!==s.length)return esc(s);
  const on=new Array(s.length).fill(false);for(const t of terms){let p=n.indexOf(t);while(p>=0){for(let k=p;k<p+t.length;k++)on[k]=true;p=n.indexOf(t,p+t.length)}}
  let out='',open=false;for(let k=0;k<s.length;k++){if(on[k]!==open){out+=on[k]?'<mark>':'</mark>';open=on[k]}out+=esc(s[k])}return out+(open?'</mark>':'');
}
function snippet(i,terms){
  const src=[i.notes,(i.checklist||[]).map(c=>c.text).join(' · '),i.place].filter(Boolean).join(' · ');if(!src)return '';
  const n=norm(src);let p=-1;for(const x of terms){const q=n.indexOf(x);if(q>=0&&(p<0||q<p))p=q}
  if(p<0)return esc(src.slice(0,90))+(src.length>90?'…':'');const a=Math.max(0,p-36);
  return hl((a>0?'…':'')+src.slice(a,a+110)+(a+110<src.length?'…':''),terms);
}
function renderSearch(){
  const q=qEl.value,box=$('#sres');if(!q.trim()){box.hidden=true;return}
  const terms=norm(q).trim().split(/\s+/).filter(Boolean);sres=searchItems(q);
  const fl=[...files.values()].filter(f=>{const fo=folders.get(f.folder);const h=norm([f.name,f.desc,fo?fo.name:'','arquivo'].join(' '));return terms.every(t=>h.includes(t))}).slice(0,8);
  sres=sres.concat(fl.map(f=>({...f,kind:'file'})));if(selIdx>=sres.length)selIdx=0;box.hidden=false;
  box.innerHTML=sres.length?sres.map((i,k)=>{if(i.kind==='file')return `<button class="sr-it${k===selIdx?' on':''}" data-act="fopen" data-fid="${i.id}"><span class="sr-k">Arquivo<br><span class="mono">${(FT[i.ext]||[i.ext])[0]}</span></span><span><b>${hl(i.name,terms)}</b><span class="s">${fmtSize(i.size||0)}${i.desc?' · '+esc(i.desc.slice(0,60)):''}</span>${folders.get(i.folder)?`<span class="s" style="display:block">${folderChip(i)}</span>`:''}</span></button>`;
    const sn=snippet(i,terms);
    return `<button class="sr-it${k===selIdx?' on':''}" data-act="sopen" data-id="${i.id}"><span class="sr-k">${KINDS[i.kind]}${i.kind==='task'&&i.done?'<br>feita':''}${i.date?`<br><span class="mono">${ddmm(parse(i.date))}</span>`:''}</span>
      <span><b>${hl(i.title,terms)}</b>${sn?`<span class="s">${sn}</span>`:''}${folders.get(folderOf(i))?`<span class="s" style="display:block">${folderChip(i)}</span>`:''}</span></button>`}).join('')
    :`<div class="bp-empty">Nada encontrado para “${esc(q.trim())}”.</div>`;
}
function closeSearch(){$('#sres').hidden=true;qEl.blur()}
qEl.addEventListener('input',()=>{selIdx=0;renderSearch()});
qEl.addEventListener('focus',()=>{if(qEl.value.trim())renderSearch()});
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'&&sres.length){e.preventDefault();selIdx=(selIdx+1)%sres.length;renderSearch()}
  else if(e.key==='ArrowUp'&&sres.length){e.preventDefault();selIdx=(selIdx-1+sres.length)%sres.length;renderSearch()}
  else if(e.key==='Enter'){e.preventDefault();const it=sres[selIdx];if(it){closeSearch();if(it.kind==='file')openFileDlg(files.get(it.id));else openEditor(it)}}
  else if(e.key==='Escape'){if(qEl.value){qEl.value='';renderSearch()}else closeSearch()}
});
document.addEventListener('click',e=>{if(!$('#sres').hidden&&!e.target.closest('#searchwrap'))$('#sres').hidden=true});

/* ---------- Lembretes ---------- */
let soundOn=false,audio=null;
function notifState(){try{return 'Notification' in window?Notification.permission:'unsupported'}catch(e){return 'unsupported'}}
function unlockAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();soundOn=true}catch(e){}}
document.addEventListener('pointerdown',()=>{if(!soundOn){unlockAudio();if(unlocked)renderNav()}},{once:true});
async function enableNotify(){unlockAudio();chime();try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
  if(notifState()!=='granted')toast('Som dos lembretes ativado','Os lembretes tocam aqui enquanto a agenda estiver aberta.');render()}
function chime(){if(!audio||!soundOn)return;try{const t=audio.currentTime;[[880,0],[1175,.18]].forEach(([f,o])=>{const g=audio.createGain(),osc=audio.createOscillator();osc.type='sine';osc.frequency.value=f;
  g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.18,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.6);osc.connect(g).connect(audio.destination);osc.start(t+o);osc.stop(t+o+.65)})}catch(e){}}
function reminders(){const out=[];for(const o of occurrences(ymd(addDays(new Date(),-1)),9)){const i=o.i;if(i.remind==null||i.remind==='')continue;if(i.kind==='task'&&i.done)continue;out.push({i,date:o.date,start:o.start,at:o.start-Number(i.remind)*60000})}return out}
let fired={};try{fired=JSON.parse(localStorage.getItem('oncourt.fired')||'{}')}catch(e){}
function rel(ms){const m=Math.round(ms/60000);if(m<1)return 'agora';if(m<60)return `em ${m} min`;const h=Math.floor(m/60),r=m%60;if(h<24)return `em ${h} h${r?' '+r+' min':''}`;const d=Math.round(h/24);return `em ${d} ${ss(d,'dia','dias')}`}
function checkReminders(){
  if(!loaded||!unlocked)return;const now=Date.now();let changed=false;
  for(const r of reminders()){const i=r.i,key=i.id+'@'+r.at;
    if(now>=r.at&&now-r.at<6*3600e3&&!fired[key]){fired[key]=now;changed=true;
      const when=i.kind==='task'?`Prazo: ${shortDate(r.date)}${i.time?' às '+i.time:''}`:`${r.start>now?rel(r.start-now).replace(/^em/,'Começa em'):'Agora'}${i.time?' · '+i.time:''}${i.place?' · '+i.place:''}`;
      toast(i.title,when,i.id);chime();addInbox(key,i,when);
      if(notifState()==='granted'){try{new Notification(i.title,{body:when,tag:key})}catch(e){}}}}
  if(changed){for(const k in fired)if(now-fired[k]>3*864e5)delete fired[k];try{localStorage.setItem('oncourt.fired',JSON.stringify(fired))}catch(e){}}
}
let inbox=[];try{inbox=JSON.parse(localStorage.getItem('oncourt.inbox')||'[]')}catch(e){}
const saveInbox=()=>{try{localStorage.setItem('oncourt.inbox',JSON.stringify(inbox))}catch(e){}renderBell()};
function addInbox(key,i,when){if(inbox.some(n=>n.key===key))return;inbox.unshift({key,id:i.id,title:i.title,body:when,at:Date.now(),read:false});inbox=inbox.slice(0,30);saveInbox();
  const b=$('#bellBtn');b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring')}
function ago(ms){const m=Math.round((Date.now()-ms)/60000);if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.floor(m/60);if(h<24)return `há ${h} h`;const d=Math.floor(h/24);return `há ${d} ${ss(d,'dia','dias')}`}
function renderBell(){
  const unread=inbox.filter(n=>!n.read).length,badge=$('#bellBadge');badge.hidden=!unread;badge.textContent=unread>9?'9+':unread;
  $('#bellBtn').setAttribute('aria-label',unread?`Notificações: ${unread} não lidas`:'Notificações');
  document.title=(unread&&unlocked?`(${unread}) `:'')+'Agenda OnCourt';
  const pop=$('#bellpop');if(pop.hidden)return;const now=Date.now();
  const up=loaded?reminders().filter(r=>r.at>now&&r.at-now<7*864e5).sort((a,b)=>a.at-b.at).slice(0,8):[];
  const fmt=at=>{const d=new Date(at),s=ymd(d);return `${s===todayStr()?'hoje':s===ymd(addDays(new Date(),1))?'amanhã':shortDate(s)} às ${hhmm(d)}`};
  pop.innerHTML=`<div class="bp-h"><strong>Notificações</strong>${unread?'<button data-act="bellread">Marcar como lidas</button>':''}</div>
  <div class="bp-sec">Recebidas</div>${inbox.length?inbox.slice(0,12).map(n=>`<button class="bp-it ${n.read?'read':'unread'}" data-act="bellitem" data-key="${esc(n.key)}"><i></i><span><b>${esc(n.title)}</b><span>${esc(n.body)} · ${ago(n.at)}</span></span></button>`).join(''):'<div class="bp-empty">Nenhum aviso ainda.</div>'}
  <div class="bp-sec">Próximos lembretes</div>${up.length?up.map(r=>`<button class="bp-it read" data-act="edit" data-id="${r.i.id}"><i></i><span><b>${esc(r.i.title)}</b><span>Aviso ${fmt(r.at)}</span></span></button>`).join(''):'<div class="bp-empty">Nenhum lembrete nos próximos 7 dias.</div>'}`;
}
function setBell(open){$('#bellpop').hidden=!open;$('#bellBtn').setAttribute('aria-expanded',String(open));renderBell()}
$('#bellBtn').addEventListener('click',()=>setBell($('#bellpop').hidden));
document.addEventListener('click',e=>{if(!$('#bellpop').hidden&&!e.target.closest('#bellwrap')&&!e.target.closest('dialog'))setBell(false)});
function toast(title,body,id,ttl){
  if(!unlocked)return;
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','alert');
  el.innerHTML=`<span class="tb" aria-hidden="true">${BELLSVG}</span><b>${esc(title)}</b><span>${esc(body)}</span><div class="acts">${id?'<button data-x="open">Abrir</button>':''}<button data-x="ok">Fechar</button></div>`;
  el.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='open'&&items.get(id))openEditor(items.get(id));el.remove()});
  $('#toasts').prepend(el);if(!id)setTimeout(()=>el.remove(),ttl||6000);
}
setInterval(()=>{checkReminders();if(unlocked&&view==='dash'&&!dlg.open&&!document.hidden)render()},60000);setInterval(checkReminders,30000);

store.init();
})();
